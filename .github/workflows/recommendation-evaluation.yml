name: Recommendation quality evaluation

on:
  pull_request:
    branches: [main]
    paths:
      - 'services/recommendation-service/src/main/java/com/vellumhub/recommendation_service/module/book_feature/**'
      - 'services/recommendation-service/src/test/java/com/vellumhub/recommendation_service/evaluation/**'
      - 'services/recommendation-service/evaluation/**'
      - '.github/workflows/recommendation-evaluation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EVALUATION_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Confirm Docker for pgvector Testcontainers
        run: docker info
      - name: Pre-pull pgvector image
        run: docker pull pgvector/pgvector:pg15
      - name: Run reproducible recommendation evaluation
        run: >-
          mvn -B -ntp -pl services/recommendation-service -am
          -Dtest=RecommendationQualityEvaluationIT
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dgroups=evaluation
          -Devaluation.commitSha=${EVALUATION_COMMIT_SHA}
          -Devaluation.outputDir=${GITHUB_WORKSPACE}/services/recommendation-service/target/evaluation-results/reference
          -Devaluation.command='mvn -pl services/recommendation-service -am -Dtest=RecommendationQualityEvaluationIT -Dsurefire.failIfNoSpecifiedTests=false -Dgroups=evaluation test'
          test
      - name: Upload evaluation evidence
        uses: actions/upload-artifact@v4
        with:
          name: recommendation-quality-evaluation-${{ env.EVALUATION_COMMIT_SHA }}
          path: services/recommendation-service/target/evaluation-results/reference/
          if-no-files-found: error
          retention-days: 30
